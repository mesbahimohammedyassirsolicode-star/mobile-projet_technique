<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes recettes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="main.js" defer></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-800">
    <div class="min-h-screen md:flex">
        <aside class="flex w-full flex-col bg-white px-5 py-6 md:min-h-screen md:w-64 md:border-r md:border-stone-200">
            <a href="#recipes" class="mb-8 flex items-center gap-3 text-xl font-bold">
                <span class="grid h-10 w-10 place-items-center rounded-xl bg-orange-100 text-xl" aria-hidden="true">🍲</span>
                <span>Ma cuisine</span>
            </a>
            <p class="mb-3 px-3 text-xs font-semibold uppercase tracking-wider text-stone-400">Menu</p>
            <nav aria-label="Navigation principale" class="space-y-1">
                <a href="#recipes" class="flex items-center gap-3 rounded-lg bg-orange-50 px-3 py-2.5 font-medium text-orange-700">
                    <span aria-hidden="true">▤</span> Mes recettes
                </a>
                <a href="#recipe-form" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-stone-600 hover:bg-stone-100">
                    <span aria-hidden="true">＋</span> Ajouter une recette
                </a>
            </nav>
           
        </aside>

        <main class="min-w-0 flex-1 px-4 py-8 sm:px-8 lg:px-10">
            <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
                <div>
                    <p class="text-sm text-stone-500">Cuisine / Recettes</p>
                    <h1 class="mt-1 text-2xl font-bold tracking-tight sm:text-3xl">Mes recettes</h1>
                </div>
                <a href="#recipe-form" class="rounded-lg bg-orange-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-orange-700">＋ Ajouter une recette</a>
            </header>

            <section id="recipe-form" class="mb-7 rounded-xl border border-stone-200 bg-white p-5 shadow-sm sm:p-6">
                <div class="mb-5">
                    <h2 class="text-lg font-semibold">Nouvelle recette</h2>
                    <p class="mt-1 text-sm text-stone-500">Renseignez le titre et choisissez une catégorie.</p>
                </div>
                <form id="recipe-form-element" class="grid gap-4 sm:grid-cols-[1fr_1fr_auto] sm:items-end">
                    <div>
                        <label for="titre" class="mb-1.5 block text-sm font-medium">Titre</label>
                        <input id="titre" name="titre" type="text" required maxlength="100" placeholder="Ex. Tajine"
                            class="w-full rounded-lg border border-stone-300 px-3 py-2.5 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100">
                    </div>
                    <div>
                        <label for="category_id" class="mb-1.5 block text-sm font-medium">Catégorie</label>
                        <select id="category_id" name="category_id" required
                            class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2.5 outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100">
                            <option value="">Sélectionner une catégorie</option>
                            <option value="Entrée">Entrée</option>
                            <option value="Plat principal">Plat principal</option>
                            <option value="Dessert">Dessert</option>
                        </select>
                    </div>
                    <button type="submit" class="rounded-lg bg-orange-600 px-4 py-2.5 font-semibold text-white hover:bg-orange-700">Ajouter</button>
                    <p id="message" class="hidden rounded-md px-3 py-2 text-sm sm:col-span-3" role="status" aria-live="polite"></p>
                </form>
            </section>

            <section id="recipes" class="overflow-hidden rounded-xl border border-stone-200 bg-white shadow-sm">
                <div class="flex items-center justify-between border-b border-stone-200 px-5 py-4 sm:px-6">
                    <div>
                        <h2 class="font-semibold">Toutes les recettes</h2>
                        <p class="mt-1 text-sm text-stone-500">Vos recettes enregistrées</p>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-stone-50 text-xs uppercase tracking-wide text-stone-500">
                            <tr>
                                <th class="px-5 py-3 font-semibold sm:px-6">ID</th>
                                <th class="px-5 py-3 font-semibold">Titre</th>
                                <th class="px-5 py-3 font-semibold sm:px-6">Catégorie</th>
                            </tr>
                        </thead>
                        <tbody id="recipe-list" class="divide-y divide-stone-100"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
